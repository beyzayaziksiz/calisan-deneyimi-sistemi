<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sunar Yanımda 2.0</title>
<style>
body { font-family: Arial; margin:20px; max-width:1100px; }
h1 { margin-bottom:10px; }
.tab { cursor:pointer; padding:10px 20px; border:1px solid #ccc; display:inline-block; margin-right:5px; }
.active { background:#f0f0f0; }
.section { margin-top:20px; }
.card { border:1px solid #ddd; padding:15px; margin-top:15px; border-radius:8px; }
input, select, button { padding:8px; margin-right:5px; margin-top:5px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border-bottom:1px solid #ddd; padding:8px; text-align:left; }
.badge { padding:4px 8px; border-radius:12px; font-size:12px; }
.green { background:#d4edda; }
.red { background:#f8d7da; }
</style>
</head>
<body>

<h1>Sunar Yanımda 2.0</h1>

<div>
<span class="tab active" onclick="showTab('emp')">Çalışanlar</span>
<span class="tab" onclick="showTab('norm')">Norm Kadro</span>
</div>

<div id="emp" class="section">

<div class="card">
<h3>Çalışan Ekle</h3>
<input id="name" placeholder="Ad Soyad">
<input id="sicil" placeholder="Sicil No">
<select id="dept">
<option>İnsan & Kültür</option>
<option>Finans</option>
<option>Operasyon</option>
<option>Satış</option>
</select>
<input id="position" placeholder="Pozisyon">
<button onclick="addEmployee()">Ekle</button>
</div>

<div class="card">
<h3>Çalışan Listesi</h3>
<table>
<thead>
<tr>
<th>Ad Soyad</th>
<th>Sicil</th>
<th>Departman</th>
<th>Pozisyon</th>
<th>Durum</th>
</tr>
</thead>
<tbody id="empTable"></tbody>
</table>
</div>

</div>

<div id="norm" class="section" style="display:none;">

<div class="card">
<h3>Norm Kadro Ekle</h3>
<select id="normDept">
<option>İnsan & Kültür</option>
<option>Finans</option>
<option>Operasyon</option>
<option>Satış</option>
</select>
<input id="normPosition" placeholder="Pozisyon">
<input id="normPlan" type="number" placeholder="Planlanan Adet">
<button onclick="addNorm()">Ekle</button>
</div>

<div class="card">
<h3>Plan vs Fiili</h3>
<table>
<thead>
<tr>
<th>Departman</th>
<th>Pozisyon</th>
<th>Plan</th>
<th>Dolu</th>
<th>Açık</th>
</tr>
</thead>
<tbody id="normTable"></tbody>
</table>
</div>

</div>

<script>

let employees = JSON.parse(localStorage.getItem("emp")) || [];
let norms = JSON.parse(localStorage.getItem("norm")) || [];

function save() {
localStorage.setItem("emp", JSON.stringify(employees));
localStorage.setItem("norm", JSON.stringify(norms));
}

function showTab(tab) {
document.getElementById("emp").style.display = tab==="emp"?"block":"none";
document.getElementById("norm").style.display = tab==="norm"?"block":"none";

let tabs = document.querySelectorAll(".tab");
tabs.forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");
}

function addEmployee() {
let emp = {
name: document.getElementById("name").value,
sicil: document.getElementById("sicil").value,
dept: document.getElementById("dept").value,
position: document.getElementById("position").value,
status: "Aktif"
};
employees.push(emp);
save();
render();
}

function addNorm() {
let norm = {
dept: document.getElementById("normDept").value,
position: document.getElementById("normPosition").value,
plan: parseInt(document.getElementById("normPlan").value)
};
norms.push(norm);
save();
render();
}

function render() {
let empTable = document.getElementById("empTable");
empTable.innerHTML="";
employees.forEach(e=>{
empTable.innerHTML += `<tr>
<td>${e.name}</td>
<td>${e.sicil}</td>
<td>${e.dept}</td>
<td>${e.position}</td>
<td><span class="badge green">${e.status}</span></td>
</tr>`;
});

let normTable = document.getElementById("normTable");
normTable.innerHTML="";
norms.forEach(n=>{
let dolu = employees.filter(e=>e.dept===n.dept && e.position===n.position).length;
let acik = n.plan - dolu;

normTable.innerHTML += `<tr>
<td>${n.dept}</td>
<td>${n.position}</td>
<td>${n.plan}</td>
<td>${dolu}</td>
<td><span class="badge ${acik>0?'red':'green'}">${acik}</span></td>
</tr>`;
});
}

render();

</script>

</body>
</html>
